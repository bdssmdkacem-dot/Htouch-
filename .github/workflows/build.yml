name: Build DTOUCH APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L -f -o app/src/main/assets/hand_landmarker.task             https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la app/src/main/assets

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore permanent release keystore
        env:
          DTOUCH_KEYSTORE_B64: ${{ secrets.DTOUCH_KEYSTORE_B64 }}
        run: |
          test -n "$DTOUCH_KEYSTORE_B64"
          echo "$DTOUCH_KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/dtouch-release.jks"
          keytool -list -keystore "${{ runner.temp }}/dtouch-release.jks"             -storepass "${{ secrets.DTOUCH_STORE_PASSWORD }}" >/dev/null

      - name: Build signed release APK
        env:
          DTOUCH_KEYSTORE_PATH: ${{ runner.temp }}/dtouch-release.jks
          DTOUCH_STORE_PASSWORD: ${{ secrets.DTOUCH_STORE_PASSWORD }}
          DTOUCH_KEY_ALIAS: ${{ secrets.DTOUCH_KEY_ALIAS }}
          DTOUCH_KEY_PASSWORD: ${{ secrets.DTOUCH_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing
        run: |
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DTOUCH-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DTOUCH-release-apk
          path: app/build/outputs/apk/release/DTOUCH-release.apk
