name: Build DTOUCH APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L -f -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la app/src/main/assets
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -storetype JKS \
            -storepass dtouch-test-store \
            -keypass dtouch-test-key \
            -alias dtouch \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=DTOUCH Test, OU=Development, O=DTOUCH, L=Agadir, ST=Souss-Massa, C=MA"
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DTOUCH-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DTOUCH-release-apk
          path: app/build/outputs/apk/release/DTOUCH-release.apk
